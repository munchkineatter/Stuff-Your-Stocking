services:
  - type: web
    name: stuff-your-stocking
    runtime: node
    plan: starter # always-on; the free plan sleeps and would drop live connections
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HOST_PIN
        sync: false # set in the Render dashboard
      - key: DATA_DIR
        value: /var/data
    disk:
      name: game-data
      mountPath: /var/data
      sizeGB: 1
